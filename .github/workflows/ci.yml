name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: swift --version
      - name: Run core checks
        run: ./scripts/test.sh
      - name: Test release automation
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Build and verify Universal app
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TwinSpace-macos-universal
          path: |
            dist/TwinSpace-*-macos-universal.zip
            dist/TwinSpace-*-source.zip
            dist/README.zh-CN.md
            dist/VALIDATION.zh-CN.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
