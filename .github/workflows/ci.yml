name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Run core checks
        run: ./scripts/test.sh
      - name: Build and verify Universal app
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TwinSpace-macos-universal
          path: |
            dist/TwinSpace-*-macos-universal.zip
            dist/TwinSpace-*-source.zip
            dist/README.zh-CN.md
            dist/VALIDATION.zh-CN.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
